name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Contract and design system
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validator dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install -r scripts/requirements-contract.txt
      - name: Validate API contract and examples
        run: .ci-venv/bin/python scripts/validate_contract.py
      - name: Validate design system and assets
        run: .ci-venv/bin/python scripts/validate_design_system.py

  server-tests:
    name: Server tests (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Match the project's Linux build toolchain and database images.
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    services:
      db-test:
        image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: vapor_test
          POSTGRES_PASSWORD: vapor_test_password
          POSTGRES_DB: smartshoppinglist_testing
        options: >-
          --health-cmd "pg_isready -U vapor_test -d smartshoppinglist_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_HOST: db-test
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_USERNAME: vapor_test
      TEST_DATABASE_PASSWORD: vapor_test_password
      TEST_DATABASE_NAME: smartshoppinglist_testing
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: swift --version
      - name: Build server and tests
        run: |
          mkdir -p ci-logs
          swift build --build-tests --force-resolved-versions --jobs 4 2>&1 | tee ci-logs/build.log
      - name: Run Swift Testing suite
        run: swift test --skip-build 2>&1 | tee ci-logs/tests.log
      - name: Preserve server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-ci-logs
          path: server/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
