# Local development and integration tests; example credentials are not for deployment.
name: smartshoppinglist

volumes:
  db_data:

x-postgres-image: &postgres_image postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd

x-postgres-healthcheck: &postgres_healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 2s
  timeout: 5s
  retries: 15
  start_period: 5s

services:
  app:
    image: smartshoppinglistserver:local
    build:
      context: .
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    stop_grace_period: 30s

  db:
    image: *postgres_image
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_database
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck: *postgres_healthcheck

  db-test:
    image: *postgres_image
    profiles: ["testing"]
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: vapor_test
      POSTGRES_PASSWORD: vapor_test_password
      POSTGRES_DB: smartshoppinglist_testing
    ports:
      - '127.0.0.1:${TEST_DATABASE_PORT:-5433}:5432'
    healthcheck: *postgres_healthcheck
